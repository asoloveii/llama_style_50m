dataset_name: "alpaca"
shard_dir: null           # unused for alpaca
dataset_path: "datasets/alpaca"        
context_size: 1024
test_size: 0.05           # 5% validation split
seed: 42

epochs: 1                 
batch_size: 16             
num_workers: 4
accum_steps: 4            
max_norm: 1.0

lr: 2.0e-5                 
betas: [0.9, 0.999]
weight_decay: 0.01
warmup_steps: 30         
num_steps: 800 
eta_min: 2.0e-6
lr_factor: 0.1

val_every: 200
ckpt_every: 500
ckpt_dir: "ckpts/pretrain"
